# evals/scenarios/pod-launch/slow-readiness-probe.yaml
#
# Scenario: pod becomes Ready EVENTUALLY but takes ~45s to do so —
# because the readiness probe has a deliberately high
# initialDelaySeconds. The container itself starts in milliseconds;
# the slowness is purely the probe's gate.
#
# This is the canonical "slow launch" / latency-lens fixture. Unlike
# image-pull-slow (which is flaky in Kind due to image caching and
# network variance), this scenario is DETERMINISTIC: kubelet doesn't
# probe the container until `initialDelaySeconds` elapses, regardless
# of how fast the container actually started.
#
# Setup:
# - busybox image (cached, pulls in milliseconds)
# - sleep 3600 keeps the container running
# - readinessProbe: exec [true], initialDelaySeconds=45
#   → kubelet waits 45s, then probes; the probe succeeds, pod
#     transitions to Ready=true
# - Total time-to-Ready: ~45-55s (the 45s delay + a few seconds of
#   K8s pipeline overhead)
#
# What the agent's bootstrap sees:
# - The pod is Running, Ready=true (when invoked after the gate
#   passes; this is the meaningful invocation case for latency
#   diagnostics).
# - `<launch_timing>` block in the first user message shows:
#     creation_to_scheduled: <1s
#     scheduled_to_initialized: 1-3s
#     initialized_to_containers_ready: ~45s ← the long pole
#     containers_ready_to_ready: ~0s
#     total_time_to_ready: ~48s
#
# What the agent should diagnose:
# - Latency lens activates because total_time_to_ready (~48s) is in
#   the slow-but-not-failing range.
# - Identifies `initialized_to_containers_ready` as the long pole.
# - Reads pod.spec.containers[0].readinessProbe and sees
#   initialDelaySeconds: 45 — the cause.
# - Remediation: lower initialDelaySeconds (cite a specific lower
#   value like 5-10s, with the reasoning that failureThreshold +
#   periodSeconds already provides startup tolerance).
# - confidence=high (the timing data is direct condition evidence
#   AND the probe spec confirms the cause).
#
# Note for scenario-apply: this scenario takes longer than usual to
# reach its "ready" state (~50s). The Makefile wait loop must
# account for this — it should EITHER detect "Ready=true and
# time-to-Ready > 30s" as a stuck-state-equivalent, OR just wait
# long enough.

---
apiVersion: v1
kind: Namespace
metadata:
  name: eval-slow-readiness-probe
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    eval-scenario: slow-readiness-probe
    eval-purpose: pod-launch-latency-lens-fixture
    app.kubernetes.io/managed-by: k8s-debug-agents-evals

---
apiVersion: v1
kind: Pod
metadata:
  name: slow-ready-app
  namespace: eval-slow-readiness-probe
  labels:
    eval-scenario: slow-readiness-probe
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
      resources:
        requests:
          cpu: "50m"
          memory: "32Mi"
        limits:
          cpu: "50m"
          memory: "32Mi"
      readinessProbe:
        exec:
          # Probe always succeeds — the slowness is purely the
          # initialDelaySeconds gate, not probe failures.
          command: ["true"]
        # 45s before the FIRST probe attempt. Pod can't reach
        # Ready=true until this elapses, even though the container
        # starts in milliseconds.
        initialDelaySeconds: 45
        periodSeconds: 10
        failureThreshold: 3
        successThreshold: 1
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault
  restartPolicy: Never
