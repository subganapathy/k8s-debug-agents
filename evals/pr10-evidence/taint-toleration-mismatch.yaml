    improvements:
    - category: pod_spec
      roi: high
      suggestion: 'Add toleration validation to CI/CD pipelines or admission webhooks: whenever a pod spec includes a nodeSelector
        targeting a specific hostname, automatically verify that the pod''s tolerations cover all taints present on that node.
        This catches taint/toleration mismatches before deployment.'
    - category: admission_control
      roi: high
      suggestion: Deploy a ValidatingAdmissionWebhook (or use OPA/Kyverno) that cross-references nodeSelector hostname values
        against live node taints and rejects pod specs that would be immediately unschedulable. This makes the failure synchronous
        at apply-time rather than silent at runtime.
    - category: monitoring
      roi: medium
      suggestion: Alert on pods with PodScheduled=False for more than 2 minutes. The Kubernetes scheduler does not automatically
        retry failed placements when no cluster state changes; a pod can remain stuck indefinitely without alerting.
    - category: scheduling
      roi: low
      suggestion: Document (e.g., via a node label like `purpose=topology-test`) the intended usage of tainted nodes and maintain
        a runbook specifying which workload types are allowed on reserved nodes. This reduces the chance of operators writing
        nodeSelectors that target reserved nodes without the required tolerations.
    problem: 'Pod `needs-worker3` is permanently stuck in Pending because it targets node `debug-agent-worker3` via `spec.nodeSelector:
      kubernetes.io/hostname: debug-agent-worker3`, but that node carries a `NoSchedule` taint (`reserved=topology-test`)
      for which the pod has no matching toleration. The pod''s only tolerations cover `node.kubernetes.io/not-ready` and `node.kubernetes.io/unreachable`
      (both `NoExecute`), which are Kubernetes built-ins and do nothing to overcome the custom `reserved=topology-test:NoSchedule`
      taint. Since the nodeSelector pins the pod exclusively to `debug-agent-worker3`, the scheduler cannot fall back to `debug-agent-worker`
      or `debug-agent-worker2` (the two untainted worker nodes), making the pod permanently unschedulable.'
    remediations:
    - action: "Add a toleration for the node's taint to the pod spec. Since this pod is not controller-managed (restartPolicy=Never,\
        \ no owner), delete and re-create it with the following addition under spec.tolerations:\n\n```yaml\ntolerations:\n\
        \  - key: \"reserved\"\n    operator: \"Equal\"\n    value: \"topology-test\"\n    effect: \"NoSchedule\"\n  # keep\
        \ the existing system tolerations below\n  - effect: NoExecute\n    key: node.kubernetes.io/not-ready\n    operator:\
        \ Exists\n    tolerationSeconds: 300\n  - effect: NoExecute\n    key: node.kubernetes.io/unreachable\n    operator:\
        \ Exists\n    tolerationSeconds: 300\n```\n\nThen re-apply: kubectl delete pod -n eval-taint-toleration-mismatch needs-worker3\
        \ && kubectl apply -f <updated-manifest>"
      tradeoffs: The pod will now be allowed to run on debug-agent-worker3. Only use this if the workload is intended to run
        on reserved/topology-test nodes. If the taint is meant to keep regular workloads away from worker3, granting this
        toleration bypasses that isolation policy.
    - action: "If the workload does NOT need to run on debug-agent-worker3 specifically, remove the nodeSelector entirely\
        \ (or change it to target debug-agent-worker or debug-agent-worker2, which have no taints):\n\n```yaml\n# Remove or\
        \ replace the nodeSelector\nnodeSelector:\n  kubernetes.io/hostname: debug-agent-worker  # or debug-agent-worker2\n\
        ```"
      tradeoffs: The pod will schedule on a different node than originally intended. Appropriate only if the worker3 pinning
        was incorrect or unnecessary. If the workload has a topology/zone requirement (worker3 is in us-west-2c), moving it
        to worker or worker2 changes the zone.
    - action: 'If the taint on debug-agent-worker3 was applied by mistake and the node should not be reserved, remove the
        taint:


        ```

        kubectl taint nodes debug-agent-worker3 reserved=topology-test:NoSchedule-

        ```'
      tradeoffs: This un-reserves the node and allows all workloads to schedule on it. Only safe if the taint was unintentional
        or the reservation is no longer needed. This is a cluster-wide change affecting all pods targeting worker3.
