    confidence: high
    evidence:
    - detail: Container 'app' is in state CrashLoopBackOff (waiting), restartCount=1, lastState.terminated.exitCode=1, reason=Error.
        The pod has been crashing since first start at 2026-05-30T08:23:45Z.
      kind: pod_status
    - detail: "The pod's spec.containers[0] has no `env`, `envFrom`, or Secret/ConfigMap-backed volume mounts \u2014 zero\
        \ environment variables are injected into the container."
      kind: pod_spec
    - detail: The startup command iterates over 20 required env vars (DB_URL, DB_USERNAME, DB_PASSWORD, REDIS_HOST, REDIS_PORT,
        KAFKA_BROKERS, S3_BUCKET, S3_REGION, SENTRY_DSN, OTEL_ENDPOINT, LOG_LEVEL, HTTP_PORT, GRPC_PORT, METRICS_PORT, FEATURE_FLAGS,
