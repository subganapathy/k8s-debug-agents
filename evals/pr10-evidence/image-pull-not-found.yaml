    improvements:
    - category: admission_control
      roi: high
      suggestion: Deploy a ValidatingAdmissionWebhook (or use a policy engine like OPA/Gatekeeper or Kyverno) that pre-validates
        image references against a known registry or tag allowlist before the pod is admitted. This catches nonexistent or
        misspelled tags at deploy time rather than at runtime.
    - category: pod_spec
      roi: high
      suggestion: Enforce image digest pinning (e.g., 'busybox@sha256:...') in production workloads instead of mutable tags.
        Digests are immutable and will fail fast at CI/CD time if the image doesn't exist, rather than silently deploying
        a bad tag.
    - category: monitoring
      roi: medium
      suggestion: Add an alert for pods in ErrImagePull or ImagePullBackOff state lasting more than 2 minutes (e.g., kube_pod_container_status_waiting_reason{reason=~'ErrImagePull|ImagePullBackOff'}
        > 0 for 2m in Prometheus/Alertmanager). This surfaces broken image references quickly.
    - category: image_optimization
      roi: high
      suggestion: Integrate image existence validation into the CI/CD pipeline (e.g., 'docker manifest inspect <image>:<tag>'
        or 'crane digest <image>:<tag>') as a pre-deploy gate so invalid image references are caught before they reach the
        cluster.
    problem: "The pod `bad-image-pod` is stuck in `ErrImagePull` because the container image `busybox:nonexistent-tag-9999-test`\
      \ does not exist in Docker Hub. The kubelet on node `debug-agent-worker2` attempted to pull `docker.io/library/busybox:nonexistent-tag-9999-test`\
      \ and received a \"not found\" (HTTP 404) response from the registry. Since the image is not cached locally and the\
      \ tag is invalid, the container can never start. The pod's `restartPolicy: Never` means it will not retry automatically\
      \ \u2014 it will remain permanently in this Pending/ErrImagePull state unless corrected."
    remediations:
    - action: "Update the container image to a valid, existing busybox tag. For example, patch the pod spec:\n\n  kubectl\
        \ patch pod bad-image-pod -n eval-image-pull-not-found \\\n    --type='json' \\\n    -p='[{\"op\": \"replace\", \"\
        path\": \"/spec/containers/0/image\", \"value\": \"busybox:1.36.1\"}]'\n\nOr, if managed by a higher-level object\
        \ (Deployment, Job, etc.), update the image there. Confirmed valid tags for the official busybox image include: latest,\
        \ 1.36.1, 1.35, stable."
      tradeoffs: "Since restartPolicy=Never, the existing pod cannot be restarted in-place after a patch \u2014 Kubernetes\
        \ will reject spec changes to a running/pending pod's container image for a bare pod. You must delete and recreate\
        \ the pod with the corrected image. If this pod is owned by a controller, update the controller's template instead."
    - action: If the intent was to use a private or custom image with tag 'nonexistent-tag-9999-test', ensure the image is
        built and pushed to the correct registry first, then update the image reference in the pod spec to include the full
        registry path (e.g., 'myregistry.example.com/busybox:nonexistent-tag-9999-test') and add an appropriate imagePullSecret
        if the registry is private.
      tradeoffs: Requires a functioning CI/CD pipeline to build and push the image. Adding imagePullSecrets requires creating
        the Secret and referencing it in the pod spec (or default ServiceAccount).
