      kind: pod_spec
    - detail: 'imagePullPolicy is ''IfNotPresent'': kubelet attempted a pull because the image was not locally cached, and
        the pull failed with a registry 404.'
      kind: pod_spec
    - detail: imageID is empty (''), confirming the image was never successfully pulled or found in the local cache.
      kind: pod_status
    - detail: restartPolicy is 'Never', so the pod will not self-recover. It will remain stuck in this state until the spec
