{{- if .Values.credentialAuthz.enabled -}}
{{/*
AuthorizationPolicy: lock down who can call credential-authz.

This is the L7 mesh-level access control sitting on top of mTLS. Even if
an attacker gets onto the mesh (compromised pod with valid mTLS cert),
this policy limits which SAs are allowed to invoke the credential-authz
gRPC service.

How Istio enforces this: each AuthorizationPolicy is compiled into RBAC
rules that the Envoy sidecar in front of credential-authz checks BEFORE
forwarding the request to the application. The check happens at the
inbound filter chain on credential-authz's sidecar:

  Inbound request to credential-authz pod
       │
       ↓ (mTLS handshake — peer cert validated against istiod's CA)
  ┌─ credential-authz sidecar inbound listener ─────────────────────┐
  │  PeerAuthentication(STRICT) check: cert valid, peer in mesh     │
  │  AuthorizationPolicy check (this resource):                     │
  │    Is the peer's SPIFFE identity allowed?                       │
  │    Is the destination port allowed?                             │
  │    If yes → forward to credential-authz container               │
  │    If no  → return 403 (RBAC: access denied)                    │
  └─────────────────────────────────────────────────────────────────┘

The peer's identity comes from its mTLS client certificate (provisioned
by istiod). Format:
  spiffe://cluster.local/ns/<namespace>/sa/<serviceaccount-name>

PR-10 scope: tightened to match per-Job SA pattern. Agent variant Jobs
get per-invocation SAs named `agent-job-<uid>` (created programmatically
by agent_core.rbac_provisioner). Their SPIFFE identity matches the
wildcard pattern below.

We also keep the existing Step-3 test pod allowance (credential-flow-test
SA in any namespace) for the credential-flow end-to-end check.

A separate DENY policy isn't needed: AuthorizationPolicy is allow-list
by default. Without a matching ALLOW rule, traffic is denied.
*/}}
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: credential-authz-allow-tasks
  namespace: {{ .Values.platformNamespace.name }}
  labels:
    {{- include "k8s-debug-agents.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: credential-authz
  action: ALLOW
  rules:
    # Lightweight L7 backstop: requires the caller to be in our trust
    # domain (mesh peer with a valid SPIFFE identity from istiod).
    #
    # The TIGHT runtime access enforcement lives in the NetworkPolicy
    # (see ./network-policy.yaml). NetworkPolicy filters by pod LABEL
    # (`app.kubernetes.io/component: agent-task` +
    # `agent-task/created-by ∈ {cli, dispatcher}`), which works across
    # arbitrary target namespaces — something Istio AuthorizationPolicy
    # can't do because its `principals` field doesn't support
    # segment-wise wildcards on SPIFFE URIs.
    #
    # Layered defense (top = first gate hit):
    #   1. NetworkPolicy        — L3/L4 pod-label gate (primary)
    #   2. PeerAuthentication   — STRICT mTLS handshake
    #   3. AuthorizationPolicy  — this rule (mesh peer presence check)
    #   4. Kyverno (PR-16)      — admission-time label & RBAC enforcement
    #
    # Why keep this rule at all: defense in depth. If someone disables
    # NetworkPolicy enforcement at the CNI level (or runs a CNI that
    # silently doesn't support it), AuthorizationPolicy still blocks
    # non-mesh callers. Cheap to keep.
    - from:
        - source:
            principals:
              - "cluster.local/*"
      to:
        - operation:
            ports:
              - {{ .Values.credentialAuthz.port | quote }}
{{- end -}}
