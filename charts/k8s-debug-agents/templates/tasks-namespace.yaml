{{/*
agent-tasks namespace — HOST FOR STEP-1 + STEP-3 TEST FIXTURES ONLY.

After PR-10's per-target Job model, variant Jobs no longer run here.
They run in the target pod's namespace (per-target programmatic RBAC
via agent_core.rbac_provisioner). This namespace remains because
the Step-1 smoke-test pod (`evals/smoke-test/pod.yaml`) and the
Step-3 credential-flow test pod (`evals/credential-flow/test-pod.yaml`)
both live here and verify two distinct things:

  smoke-test:        sidecar injection works for an agent-task-labeled pod
  credential-flow:   the full ext_authz pipeline injects the real API key

Both tests are independent of the variant Job pipeline that PR-10
introduces; they continue to use this dedicated namespace so the
verification artifacts are isolated from any actual diagnostic work.

Pattern B note: pods in this namespace must carry the
`sidecar.istio.io/inject: "true"` LABEL (not annotation) to get a
sidecar — the istio webhook objectSelector matches on label.

Same security posture as agent-platform: PSA restricted, ready for
sidecar injection (no special namespace label needed under Pattern B).
*/}}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.tasksNamespace.name }}
  labels:
    {{- include "k8s-debug-agents.labels" . | nindent 4 }}
    app.kubernetes.io/part-of-namespace: tasks
    {{- with .Values.tasksNamespace.podSecurity.enforce }}
    pod-security.kubernetes.io/enforce: {{ . | quote }}
    {{- end }}
    {{- with .Values.tasksNamespace.podSecurity.enforceVersion }}
    pod-security.kubernetes.io/enforce-version: {{ . | quote }}
    {{- end }}
    {{- with .Values.tasksNamespace.podSecurity.audit }}
    pod-security.kubernetes.io/audit: {{ . | quote }}
    {{- end }}
    {{- with .Values.tasksNamespace.podSecurity.auditVersion }}
    pod-security.kubernetes.io/audit-version: {{ . | quote }}
    {{- end }}
    {{- with .Values.tasksNamespace.podSecurity.warn }}
    pod-security.kubernetes.io/warn: {{ . | quote }}
    {{- end }}
    {{- with .Values.tasksNamespace.podSecurity.warnVersion }}
    pod-security.kubernetes.io/warn-version: {{ . | quote }}
    {{- end }}
  {{- with .Values.global.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
